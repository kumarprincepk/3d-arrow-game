<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1936" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Neon Cyan Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cyan Arrow Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0066ff" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Target Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#7000ff" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
  </defs>

  <!-- Background Circle Badge -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGlow)" stroke="#00f0ff" stroke-width="8" stroke-opacity="0.4" />

  <!-- Outer Neon Target Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#ringGrad)" stroke-width="12" filter="url(#neonGlow)" opacity="0.8" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#00f0ff" stroke-width="6" stroke-dasharray="24 16" opacity="0.6" />

  <!-- Glowing 3D Arrow Up Shape -->
  <g filter="url(#neonGlow)">
    <!-- Arrow Shaft -->
    <rect x="232" y="240" width="48" height="150" rx="8" fill="url(#cyanGrad)" />
    
    <!-- Arrow Head -->
    <path d="M 256 90 L 360 260 L 296 260 L 296 260 L 216 260 L 152 260 Z" fill="url(#cyanGrad)" />

    <!-- Center Bright Highlight Core -->
    <path d="M 256 120 L 330 244 L 280 244 L 280 370 L 232 370 L 232 244 L 182 244 Z" fill="#ffffff" opacity="0.8" />
  </g>
</svg>